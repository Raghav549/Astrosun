services:
  - type: web
    name: astrosun
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/router.mjs
    envVars:
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: AIHUBMIX_API_KEY
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: AIHUBMIX_BASE_URL
        value: https://aihubmix.com/v1
