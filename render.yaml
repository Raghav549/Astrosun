services:
  - type: web
    name: astrosun
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_PROVIDER_BASE_URL
        sync: false
      - key: AI_PROVIDER_MODEL
        sync: false
      - key: AIHUBMIX_API_KEY
        sync: false
      - key: AIHUBMIX_MODEL
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: AIHUBMIX_BASE_URL
        value: https://aihubmix.com/v1
  - type: web
    name: astrosun-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm run server:start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: astrosun-db
          property: connectionString
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_PROVIDER_BASE_URL
        sync: false
      - key: AI_PROVIDER_MODEL
        sync: false
      - key: AIHUBMIX_API_KEY
        sync: false
      - key: AIHUBMIX_MODEL
        sync: false
      - key: AIHUBMIX_BASE_URL
        value: https://aihubmix.com/v1
      - key: NASA_API_KEY
        sync: false

databases:
  - name: astrosun-db
    plan: free
    region: singapore
    databaseName: astrosun
    user: astrosun
