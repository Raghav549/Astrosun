services:
  - type: web
    name: astrosun
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: AIHUBMIX_API_KEY
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: AIHUBMIX_BASE_URL
        value: https://aihubmix.com/v1
