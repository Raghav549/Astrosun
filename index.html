<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#5d5cf1"/><meta name="description" content="AstroSun — research-oriented astronomy, astrophysics and Panchanga computation."/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="manifest" href="/manifest.webmanifest"/><link rel="icon" href="/icon-192.png"/><link rel="apple-touch-icon" href="/icon-192.png"/><link rel="stylesheet" href="/src/boot.css"/><title>AstroSun — Cosmic Intelligence</title></head><body><div id="root"><div class="boot-shell" role="status" aria-live="polite"><div class="boot-shell-orbit">✦</div><div class="boot-shell-title">ASTROSUN</div><div class="boot-shell-subtitle">Loading cosmic intelligence…</div></div></div><script>(()=>{const root=document.getElementById('root');const show=(value)=>{if(!root||root.dataset.bootHandled==='1')return;root.dataset.bootHandled='1';const message=value instanceof Error?value.message:String(value??'Unknown startup error');root.innerHTML='<div class="boot-shell boot-shell-error"><div class="boot-shell-orbit">!</div><div class="boot-shell-title">ASTROSUN</div><div class="boot-shell-subtitle">The app could not start.</div><pre class="boot-shell-detail"></pre><button class="boot-shell-reload" onclick="location.reload()">Reload</button></div>';const detail=root.querySelector('.boot-shell-detail');if(detail)detail.textContent=message};window.addEventListener('error',event=>show(event.error||event.message));window.addEventListener('unhandledrejection',event=>show(event.reason))})();</script><script type="module" src="/src/main-production.jsx"></script></body></html>
