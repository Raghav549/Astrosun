name: AstroSun CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package.json

      - name: Verify Node
        run: node --version

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Scientific core invariants
        run: npm run scientific:check

      - name: Deployment sanity
        run: npm run deploy:check

      - name: Production build
        run: npm run build
